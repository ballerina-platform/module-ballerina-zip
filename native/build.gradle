plugins {
    id 'java'
    id 'checkstyle'
    id 'com.github.spotbugs'
    id 'com.github.johnrengelman.shadow'
}
description = 'Zip connector for Ballerina.'
configurations {
    dist {
        transitive true
    }
}
dependencies {
    checkstyle project(':checkstyle')
    checkstyle "com.puppycrawl.tools:checkstyle:${checkstylePluginVersion}"

    implementation group: 'org.ballerinalang', name: 'ballerina-runtime', version: "${ballerinaLangVersion}"
    implementation group: 'org.apache.commons', name: 'commons-compress', version: "${commonsCompressVersion}"
    implementation group: 'commons-io', name: 'commons-io', version: "${commonsIoVersion}"
}

checkstyle {
    toolVersion "${checkstylePluginVersion}"
    configFile rootProject.file("build-config/checkstyle/build/checkstyle.xml")
    configProperties = ["suppressionFile": rootProject.file("build-config/checkstyle/build/suppressions.xml")]
}

def excludePattern = '**/module-info.java'
tasks.withType(Checkstyle).configureEach {
    exclude excludePattern
}

checkstyleMain.dependsOn(":checkstyle:downloadCheckstyleRuleFiles")

spotbugsMain {
    // The enums are not on the classpath of the script itself, so they are reached through the
    // class loader the plugin was loaded with.
    def spotbugsClassLoader = plugins["com.github.spotbugs"].class.classLoader
    def spotbugsConfidence = spotbugsClassLoader.findLoadedClass("com.github.spotbugs.snom.Confidence")
    def spotbugsEffort = spotbugsClassLoader.findLoadedClass("com.github.spotbugs.snom.Effort")
    effort = spotbugsEffort.MAX
    reportLevel = spotbugsConfidence.LOW
    reportsDir = layout.buildDirectory.dir('reports/spotbugs').get().asFile
    reports {
        html.required = true
        text.required = true
    }
    def excludeFile = rootProject.file('spotbugs-exclude.xml')
    if (excludeFile.exists()) {
        excludeFilter = excludeFile
    }
}

// There are no Java tests; the library is exercised through the Ballerina test suite.
spotbugsTest {
    enabled = false
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn configurations.dist
    from { configurations.dist.collect { it.isDirectory() ? it : zipTree(it) } } {
        exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    }
}

compileJava {
    doFirst {
        options.compilerArgs = [
                '--module-path', classpath.asPath,
        ]
        classpath = files()
    }
}
